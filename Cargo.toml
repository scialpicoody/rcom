[package]
name = "rcom"
description = "a serial tool write in rust with lua"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
authors = ["pony <trans-bug@outlook.com>"]
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "rcom"
path = "src/main.rs"


# The build that is shipped: whole-program optimisation, symbols stripped
# (`cargo build --profile dist`).
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"

# Every FerroUI crate of a release is pinned to the same exact version, so that the crates
# of the release are only ever resolved together.
[dependencies]
ferroui-base = { version = "=0.4.0-preview.1" }
ferroui-controls = { version = "=0.4.0-preview.1" }
ferroui-markup-xaml = { version = "=0.4.0-preview.1" }
ferroui-desktop = { version = "=0.4.0-preview.1" }
# The developer tools on F12 in debug builds (uncomment once ferroui-diagnostics publishes;
# also uncomment `attach_dev_tools` in src/main.rs):
# ferroui-diagnostics = { version = "=0.4.0-preview.1" }
ferroui-themes-winui = { version = "=0.4.0-preview.1" }
# ISSUE #28 (shell candidates) — examples only, same exact pin. `desktop` pulls
# `ferroui-themes-fluent` (a `launch` default we do not use; the shells pass the
# WinUI theme to `launch_themed`). Cargo.toml is nominally another lane's file:
# this line is the only edit, and only the examples use the crate.
ferroui-view = { version = "=0.4.0-preview.1", features = ["desktop"] }

# The core (src/core): the UI-agnostic serial engine. Only what the serial tracer
# bullet needs; later slices add their own (rumqttc, rustls, encoding_rs, ...).
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
# ISSUE #18 — the Lua engine (docs/design.md, "Lua layer"). `lua53` because llcom
# runs xlua (Lua 5.3 semantics) and llcom scripts must run unmodified; `vendored`
# builds the interpreter from source; `send` makes `Lua` Send+Sync so tokio timer
# tasks can drive the VM; `async` for the pre-send hook seam (#19).
mlua = { version = "0.10", features = ["lua53", "vendored", "send", "async"] }
# ISSUE #18 — backs the serde-backed `JSON` builtin (docs/design.md "Lua layer").
serde_json = "1"
serialport = "4"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"

[build-dependencies]
ferroui-build = { version = "=0.4.0-preview.1" }

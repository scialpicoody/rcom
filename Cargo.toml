[package]
name = "rcom"
description = "a serial tool write in rust with lua"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
authors = ["pony <trans-bug@outlook.com>"]
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "rcom"
path = "src/main.rs"


# The build that is shipped: whole-program optimisation, symbols stripped
# (`cargo build --profile dist`).
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"

# Every FerroUI crate of a release is pinned to the same exact version, so that the crates
# of the release are only ever resolved together.
[dependencies]
ferroui-base = { version = "=0.4.0-preview.1" }
ferroui-controls = { version = "=0.4.0-preview.1" }
ferroui-markup-xaml = { version = "=0.4.0-preview.1" }
ferroui-desktop = { version = "=0.4.0-preview.1" }
# The developer tools on F12 in debug builds (uncomment once ferroui-diagnostics publishes;
# also uncomment `attach_dev_tools` in src/main.rs):
# ferroui-diagnostics = { version = "=0.4.0-preview.1" }
ferroui-themes-winui = { version = "=0.4.0-preview.1" }
# ISSUE #28 (shell candidates) — examples only, same exact pin. `desktop` pulls
# `ferroui-themes-fluent` (a `launch` default we do not use; the shells pass the
# WinUI theme to `launch_themed`). Cargo.toml is nominally another lane's file:
# this line is the only edit, and only the examples use the crate.
ferroui-view = { version = "=0.4.0-preview.1", features = ["desktop"] }

# The core (src/core): the UI-agnostic serial engine. Only what the serial tracer
# bullet needs; later slices add their own (rumqttc, rustls, encoding_rs, ...).
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
# ISSUE #18 — the Lua engine (docs/design.md, "Lua layer"). `lua53` because llcom
# runs xlua (Lua 5.3 semantics) and llcom scripts must run unmodified; `vendored`
# builds the interpreter from source; `send` makes `Lua` Send+Sync so tokio timer
# tasks can drive the VM; `async` for the pre-send hook seam (#19).
mlua = { version = "0.10", features = ["lua53", "vendored", "send", "async"] }
# ISSUE #18 — backs the serde-backed `JSON` builtin (docs/design.md "Lua layer").
serde_json = "1"
serialport = "4"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
# Ticket #17: TOML persistence (the quick-send profile), the i18n dictionaries,
# the encoding selector's codecs, and the profile's derives.
toml = "0.8"
rust-i18n = "4"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
# Ticket #16: the log store's default directory (platform config/data dir);
# API-compatible with #17's `dirs` usage.
dirs = "7.0.0"
# ISSUE #20 — the net tools (docs/design.md, stack table): TCP/UDP/TLS server+client
# channels over tokio; TLS via rustls on the `ring` provider (the whole TLS stack
# shares one provider; aws-lc-rs pulls a C toolchain for no gain here), self-signed
# certificates generated on demand via rcgen. `webpki-roots` backs standard
# verification; the tools-page "accept any certificate" toggle is the documented
# debugging-tool escape hatch (llcom parity).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
# ISSUE #21 — the MQTT test tool (docs/design.md, stack table): the async MQTT
# client. `use-rustls-no-provider` keeps TLS support without a bundled crypto
# provider (no aws-lc-rs C toolchain): the transport is built from
# `TlsConfiguration::Rustls` over nettools' client config — the same rustls
# `ring` stack (standard webpki verification, or the accept-any debugging
# toggle).
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }

# ISSUE #23 — the serial monitor's pty-pair proxy (unix only): `openpty`, raw
# termios and `poll` on the `nix` that is already in the tree (serialport's
# dependency). At this 0.26 pin the pty module rides the `term` feature — the
# only features this adds beyond serialport's selection are `poll` and `fs`.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.26", default-features = false, features = ["term", "poll", "fs"] }

[build-dependencies]
ferroui-build = { version = "=0.4.0-preview.1" }
